<section>
    <h2>Consulter les rapports</h2>
    <form action="" [formGroup]="searchForm">
        <div class="search-wrapper">
            <span class="material-symbols-outlined">search</span>
            <input type="text" formControlName="search" placeholder="Rechercher un rapport">
        </div>

        <select name="" id="" formControlName="week">
            <option value="null">Toutes les semaines</option>
            @for ( i of [1,2,3,4]; track i) {
            <option value={{i}}>Semaine {{i}}</option>
            }
        </select>
    </form>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Titre du rapport</th>
                <th>Date de soumission</th>
                <th>Département</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (report of filterReports; track report.id) {
            <tr>
                <td>{{report.id}}</td>
                <td class="title    ">{{report.title}}</td>
                <td>{{report.submissionDate.toLocaleDateString('fr-FR')}}</td>
                <td>{{report.department}}</td>
                <td class="actions">
                    <a class="material-symbols-outlined cursor-pointer text-blue-500" title="Regarder le rapport"
                        [href]="'/view-report/' + report.id" target="_blank">visibility</a>
                    <a class="material-symbols-outlined cursor-pointer text-blue-500" [href]="'/view-report/' + report.id + '?print=true'"  title="Télecharger le rapport">download</a>
                    <a class="material-symbols-outlined cursor-pointer text-blue-500" [href]="'/view-report/' + report.id + '?print=true'" title="Imprimer le rapport">print</a>
                </td>
            </tr>
            }
        </tbody>
    </table>
    <router-outlet></router-outlet>
</section>
